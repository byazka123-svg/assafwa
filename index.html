
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assafwa - Eksklusif Fashion Muslim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                black: '#121212',
                white: '#F8F8F8',
                gold: '#C5A059',
                brown: '#4A3728',
                cream: '#F2E8DA'
              }
            },
            animation: {
              'marquee': 'marquee 25s linear infinite',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-50%)' },
              }
            }
          }
        }
      }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap');
        
        /* Base typography - prioritize Inter for everything */
        body { 
          font-family: 'Inter', sans-serif; 
          -webkit-font-smoothing: antialiased;
        }

        /* Serif reserved for specific high-level brand accents */
        .brand-serif { 
          font-family: 'Playfair Display', serif; 
        }

        .gold-gradient {
          background: linear-gradient(135deg, #C5A059 0%, #E2C285 50%, #C5A059 100%);
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f8f8f8; }
        ::-webkit-scrollbar-thumb { background: #C5A059; border-radius: 10px; }
        
        .no-scrollbar::-webkit-scrollbar {
          display: none;
        }
        .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
        }
    </style>
<script type="importmap">
