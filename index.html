<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assafwa - Eksklusif Fashion Muslim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                black: '#1D1D1D', // Deep Charcoal (Soft Black)
                white: '#FAF8F3', // Warm Ivory
                gold: '#B49156',  // Antique Gold
                brown: '#4A3728', // Kept for secondary text
                cream: '#EAE4D9'  // Muted Cream
              }
            },
            animation: {
              'marquee': 'marquee 25s linear infinite',
              'scaleX': 'scaleX 0.3s ease-in-out',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              scaleX: {
                '0%': { transform: 'scaleX(0)' },
                '100%': { transform: 'scaleX(1)' },
              }
            }
          }
        }
      }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap');
        
        /* Base typography - unified to DM Sans for a modern, minimalist feel */
        body { 
          font-family: 'DM Sans', sans-serif; 
          -webkit-font-smoothing: antialiased;
        }

        .gold-gradient {
          background: linear-gradient(135deg, #B49156 0%, #D6B88B 50%, #B49156 100%);
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #FAF8F3; }
        ::-webkit-scrollbar-thumb { background: #B49156; border-radius: 10px; }
        
        .no-scrollbar::-webkit-scrollbar {
          display: none;
        }
        .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
        }
    </style>
<script type="importmap">

  }
}
</script>
</head>
